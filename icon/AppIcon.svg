<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#34363c"/>
      <stop offset="0.5" stop-color="#16171a"/>
      <stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8fb4ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8fb4ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b79bff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#b79bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.7" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="pad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.30"/>
    </linearGradient>
    <linearGradient id="spec" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.16"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="shadow" x="-40%" y="-20%" width="180%" height="150%">
      <feDropShadow dx="0" dy="28" stdDeviation="26" flood-color="#000" flood-opacity="0.7"/>
    </filter>
    <clipPath id="tile"><rect x="64" y="64" width="896" height="896" rx="200"/></clipPath>
    <clipPath id="body"><rect x="364" y="250" width="296" height="664" rx="64"/></clipPath>
  </defs>

  <!-- nền đen -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <circle cx="330" cy="260" r="330" fill="url(#glowA)"/>
    <circle cx="760" cy="840" r="300" fill="url(#glowB)"/>
  </g>
  <rect x="66" y="66" width="892" height="892" rx="198" fill="none" stroke="url(#rim)" stroke-width="4" opacity="0.7"/>

  <g transform="translate(0 -72)">
    <!-- thân remote bằng kính -->
    <g filter="url(#shadow)">
      <rect x="364" y="250" width="296" height="664" rx="64" fill="#0b0c0e"/>
    </g>
    <rect x="364" y="250" width="296" height="664" rx="64" fill="url(#glass)"/>
    <g clip-path="url(#body)">
      <ellipse cx="512" cy="230" rx="260" ry="150" fill="url(#spec)" opacity="0.45"/>
      <!-- touchpad phẳng, tràn ngang và sát mép trên -->
      <rect x="364" y="250" width="296" height="324" fill="url(#pad)"/>
      <rect x="364" y="573" width="296" height="2" fill="#ffffff" fill-opacity="0.25"/>
    </g>
    <rect x="366" y="252" width="292" height="660" rx="62" fill="none" stroke="url(#rim)" stroke-width="4"/>

    <!-- nút -->
    <circle cx="452" cy="628" r="38" fill="url(#btn)"/>
    <circle cx="572" cy="628" r="38" fill="url(#btn)"/>
    <circle cx="452" cy="738" r="38" fill="url(#btn)"/>
    <circle cx="452" cy="848" r="38" fill="url(#btn)"/>
    <rect x="534" y="700" width="76" height="186" rx="38" fill="url(#btn)"/>

    <g fill="#0b0c0e" fill-opacity="0.85" stroke="#0b0c0e" stroke-opacity="0.85" stroke-linecap="round" stroke-linejoin="round">
      <!-- menu -->
      <path d="M462 610 L440 628 L462 646" fill="none" stroke-width="10"/>
      <!-- home -->
      <rect x="552" y="614" width="40" height="28" rx="7" fill="none" stroke-width="8"/>
      <!-- siri -->
      <rect x="442" y="718" width="20" height="30" rx="10" stroke="none"/>
      <path d="M435 739 a17 17 0 0 0 34 0" fill="none" stroke-width="7"/>
      <!-- play/pause -->
      <path d="M440 830 L440 866 L468 848 Z" stroke-width="3"/>
      <!-- âm lượng + / − -->
      <path d="M572 725 v30 M557 740 h30" fill="none" stroke-width="8"/>
      <path d="M557 846 h30" fill="none" stroke-width="8"/>
    </g>
  </g>
</svg>
