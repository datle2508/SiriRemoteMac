<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#34363c"/>
      <stop offset="0.5" stop-color="#16171a"/>
      <stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8fb4ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8fb4ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b79bff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#b79bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.7" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="pad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.30"/>
    </linearGradient>
    <linearGradient id="spec" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.16"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="shadow" x="-40%" y="-20%" width="180%" height="150%">
      <feDropShadow dx="0" dy="28" stdDeviation="26" flood-color="#000" flood-opacity="0.7"/>
    </filter>
    <clipPath id="tile"><rect x="64" y="64" width="896" height="896" rx="200"/></clipPath>
    <clipPath id="body"><rect x="332" y="148" width="360" height="728" rx="84"/></clipPath>
  </defs>

  <!-- nền đen -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <circle cx="330" cy="260" r="330" fill="url(#glowA)"/>
    <circle cx="760" cy="840" r="300" fill="url(#glowB)"/>
  </g>
  <rect x="66" y="66" width="892" height="892" rx="198" fill="none" stroke="url(#rim)" stroke-width="4" opacity="0.7"/>

  <!-- thân remote bằng kính -->
  <g filter="url(#shadow)">
    <rect x="332" y="148" width="360" height="728" rx="84" fill="#0b0c0e"/>
  </g>
  <rect x="332" y="148" width="360" height="728" rx="84" fill="url(#glass)"/>
  <g clip-path="url(#body)">
    <ellipse cx="512" cy="120" rx="300" ry="190" fill="url(#spec)" opacity="0.5"/>
  </g>
  <rect x="334" y="150" width="356" height="724" rx="82" fill="none" stroke="url(#rim)" stroke-width="4"/>

  <!-- touchpad phẳng -->
  <rect x="372" y="188" width="280" height="300" rx="52" fill="url(#pad)"/>
  <rect x="372" y="188" width="280" height="300" rx="52" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2"/>
  <path d="M392 200 H632" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round"/>

  <!-- nút -->
  <circle cx="436" cy="568" r="38" fill="url(#btn)"/>
  <circle cx="588" cy="568" r="38" fill="url(#btn)"/>
  <circle cx="512" cy="568" r="0"/>
  <!-- menu: mũi tên quay lại -->
  <path d="M446 548 L424 568 L446 588" fill="none" stroke="#0b0c0e" stroke-opacity="0.85" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- home: màn hình tv -->
  <rect x="566" y="552" width="44" height="32" rx="8" fill="none" stroke="#0b0c0e" stroke-opacity="0.85" stroke-width="10"/>

  <!-- play/pause -->
  <circle cx="436" cy="684" r="38" fill="url(#btn)"/>
  <path d="M424 664 L452 684 L424 704 Z" fill="#0b0c0e" fill-opacity="0.85"/>
  <!-- siri -->
  <circle cx="588" cy="684" r="38" fill="url(#btn)"/>
  <rect x="577" y="662" width="22" height="34" rx="11" fill="#0b0c0e" fill-opacity="0.85"/>
  <path d="M570 684 a18 18 0 0 0 36 0" fill="none" stroke="#0b0c0e" stroke-opacity="0.85" stroke-width="8" stroke-linecap="round"/>

  <!-- âm lượng -->
  <rect x="398" y="768" width="228" height="60" rx="30" fill="url(#btn)"/>
  <path d="M440 798 H478 M559 798 H597 M578 779 V817" stroke="#0b0c0e" stroke-opacity="0.85" stroke-width="10" stroke-linecap="round"/>
</svg>
