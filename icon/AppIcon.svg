<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#7cc8ff"/>
      <stop offset="0.45" stop-color="#3f86f0"/>
      <stop offset="1" stop-color="#1d3fb8"/>
    </linearGradient>
    <radialGradient id="topGlow" cx="0.3" cy="0.05" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurBig" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="80"/></filter>
    <filter id="blurMed" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="blurSm" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="blurXs" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="shadow" x="-40%" y="-20%" width="180%" height="150%">
      <feDropShadow dx="0" dy="30" stdDeviation="28" flood-color="#0a1f66" flood-opacity="0.55"/>
    </filter>
    <clipPath id="tile"><rect x="64" y="64" width="896" height="896" rx="200"/></clipPath>
    <clipPath id="body"><rect x="364" y="250" width="296" height="664" rx="64"/></clipPath>
    <clipPath id="padClip"><rect x="404" y="324" width="216" height="240" rx="36"/></clipPath>

    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.3" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.7" stop-color="#cfe6ff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="glassFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="spec" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.3" stop-color="#bfe3ff"/>
      <stop offset="1" stop-color="#3f86f0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="padGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d2a84" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#071a5c" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="padFlat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c2a86" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#0a2272" stop-opacity="0.66"/>
    </linearGradient>
    <linearGradient id="btnGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.22"/>
    </linearGradient>

    <g id="blobs">
      <circle cx="260" cy="250" r="230" fill="#bfe6ff"/>
      <circle cx="780" cy="300" r="200" fill="#8f7bff"/>
      <circle cx="420" cy="800" r="230" fill="#18c7d9"/>
      <circle cx="800" cy="780" r="190" fill="#2a4fd6"/>
    </g>
  </defs>

  <!-- nền phát sáng -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <use href="#blobs" filter="url(#blurBig)" opacity="0.45"/>
    <rect x="64" y="64" width="896" height="896" fill="url(#topGlow)"/>
  </g>
  <rect x="66" y="66" width="892" height="892" rx="198" fill="none" stroke="url(#rim)" stroke-width="4" opacity="0.8"/>

  <!-- sóng tín hiệu kính -->
  <g fill="none" stroke-linecap="round">
    <path d="M374 222 A188 188 0 0 1 650 222" stroke="#ffffff" stroke-width="22" opacity="0.92"/>
    <path d="M322 162 A268 268 0 0 1 702 162" stroke="#ffffff" stroke-width="18" opacity="0.45"/>
  </g>

  <!-- thân kính -->
  <g clip-path="url(#tile)">
    <g filter="url(#shadow)">
      <rect x="364" y="250" width="296" height="664" rx="64" fill="#0a2a8a" fill-opacity="0.25"/>
    </g>
  </g>
  <g clip-path="url(#body)">
    <!-- khúc xạ: nền phóng to nhẹ, mờ và lệch -->
    <g transform="translate(512 582) scale(1.12) translate(-512 -582) translate(-18 -26)">
      <use href="#blobs" filter="url(#blurMed)" opacity="0.55"/>
    </g>
    <rect x="364" y="250" width="296" height="664" fill="url(#glassFill)"/>
    <!-- vệt sáng cong phía trên -->
    <ellipse cx="512" cy="292" rx="150" ry="52" fill="url(#spec)" opacity="0.55" filter="url(#blurSm)"/>
    <!-- sáng dọc mép trái -->
    <rect x="372" y="330" width="14" height="480" rx="7" fill="#ffffff" opacity="0.45" filter="url(#blurSm)"/>
    <!-- tối nhẹ ở đáy để tạo độ dày -->
    <rect x="364" y="800" width="296" height="114" fill="#0a2a8a" opacity="0.28" filter="url(#blurMed)"/>
  </g>
  <rect x="364" y="250" width="296" height="664" rx="64" fill="none" stroke="url(#rim)" stroke-width="5"/>
  <rect x="373" y="259" width="278" height="646" rx="56" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2"/>

  <!-- touchpad: phẳng, tràn hết bề ngang và sát mép trên của thân -->
  <g clip-path="url(#body)">
    <rect x="364" y="250" width="296" height="324" fill="url(#padFlat)"/>
    <circle cx="512" cy="412" r="110" fill="url(#orb)" opacity="0.55"/>
    <rect x="364" y="571" width="296" height="3" fill="#ffffff" opacity="0.28"/>
  </g>
  <circle cx="512" cy="412" r="60" fill="none" stroke="#ffffff" stroke-width="5" opacity="0.85"/>
  <circle cx="512" cy="412" r="24" fill="#ffffff"/>
  <!-- viền thân vẽ lại phía trên touchpad -->
  <rect x="364" y="250" width="296" height="664" rx="64" fill="none" stroke="url(#rim)" stroke-width="5"/>

  <!-- nút hạt kính -->
  <g>
    <circle cx="452" cy="628" r="38" fill="url(#btnGlass)"/>
    <circle cx="572" cy="628" r="38" fill="url(#btnGlass)"/>
    <circle cx="452" cy="738" r="38" fill="url(#btnGlass)"/>
    <rect x="534" y="700" width="76" height="186" rx="38" fill="url(#btnGlass)"/>
    <circle cx="452" cy="628" r="37" fill="none" stroke="url(#rim)" stroke-width="2.5"/>
    <circle cx="572" cy="628" r="37" fill="none" stroke="url(#rim)" stroke-width="2.5"/>
    <circle cx="452" cy="738" r="37" fill="none" stroke="url(#rim)" stroke-width="2.5"/>
    <rect x="534" y="700" width="76" height="186" rx="38" fill="none" stroke="url(#rim)" stroke-width="2.5"/>
    <ellipse cx="452" cy="612" rx="20" ry="7" fill="#ffffff" opacity="0.6" filter="url(#blurXs)"/>
    <ellipse cx="572" cy="612" rx="20" ry="7" fill="#ffffff" opacity="0.6" filter="url(#blurXs)"/>
    <ellipse cx="452" cy="722" rx="20" ry="7" fill="#ffffff" opacity="0.6" filter="url(#blurXs)"/>
  </g>
  <!-- nút micro (Siri) -->
  <circle cx="452" cy="848" r="38" fill="url(#btnGlass)"/>
  <circle cx="452" cy="848" r="37" fill="none" stroke="url(#rim)" stroke-width="2.5"/>
  <ellipse cx="452" cy="832" rx="20" ry="7" fill="#ffffff" opacity="0.6" filter="url(#blurXs)"/>
  <!-- ký hiệu chức năng -->
  <g fill="#12306f" fill-opacity="0.88">
    <!-- bài trước -->
    <rect x="436" y="614" width="6" height="28" rx="3"/>
    <path d="M469 614 L469 642 L446 628 Z" stroke="#12306f" stroke-opacity="0.88" stroke-width="3" stroke-linejoin="round"/>
    <!-- bài kế tiếp -->
    <path d="M555 614 L555 642 L578 628 Z" stroke="#12306f" stroke-opacity="0.88" stroke-width="3" stroke-linejoin="round"/>
    <rect x="582" y="614" width="6" height="28" rx="3"/>
    <!-- phát / dừng (nay ở dưới) -->
    <g transform="translate(0 110)">
      <path d="M437 725 L437 751 L457 738 Z" stroke="#12306f" stroke-opacity="0.88" stroke-width="3" stroke-linejoin="round"/>
      <rect x="463" y="725" width="5" height="26" rx="2.5"/>
      <rect x="472" y="725" width="5" height="26" rx="2.5"/>
    </g>
    <!-- micro (nay ở giữa, trên phát/dừng) -->
    <g transform="translate(0 -110)">
      <rect x="444" y="829" width="16" height="26" rx="8"/>
      <path d="M438 847 a14 14 0 0 0 28 0" fill="none" stroke="#12306f" stroke-opacity="0.88" stroke-width="4" stroke-linecap="round"/>
      <rect x="450" y="861" width="4" height="8" rx="2"/>
    </g>
  </g>
  <path d="M572 725 v30 M557 740 h30" stroke="#12306f" stroke-opacity="0.85" stroke-width="8" stroke-linecap="round"/>
  <path d="M557 846 h30" stroke="#12306f" stroke-opacity="0.85" stroke-width="8" stroke-linecap="round"/>
</svg>
